<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>My Profile | Corridor Funding</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Re-use sidebar snippet or handle via ui.js -->
        <main class="main-content">
            <h1>Personal Profile</h1>
            <div class="card" style="max-width: 600px; margin-top: 20px;">
                <form id="profile-form">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group"><label>First Name</label><input type="text" id="p-firstName"></div>
                        <div class="form-group"><label>Last Name</label><input type="text" id="p-lastName"></div>
                    </div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="p-phone"></div>
                    <div class="form-group"><label>Street Address</label><input type="text" id="p-address"></div>
                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
                        <div class="form-group"><label>City</label><input type="text" id="p-city"></div>
                        <div class="form-group"><label>State</label><input type="text" id="p-state" readonly></div>
                        <div class="form-group"><label>Zip</label><input type="text" id="p-zip"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>
        </main>
    </div>
    <script type="module" src="profile.js"></script>
</body>
</html>
