<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Loan Calculator | Corridor Funding</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css">
    <style>
        .calc-container { max-width: 600px; margin: 40px auto; padding: 30px; background: var(--light-gray); border-radius: 8px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid var(--medium-gray); border-radius: 4px; }
        .result-box { margin-top: 30px; padding: 20px; background: var(--primary-navy); color: white; border-radius: 8px; text-align: center; }
        #monthly-payment { font-size: 2rem; font-weight: 800; color: var(--accent-teal); }
    </style>
</head>
<body>
    <div class="container">
        <div class="calc-container">
            <h2>Loan Calculator</h2>
            <p>Estimate your monthly payments.</p>
            <div class="form-group">
                <label>Loan Amount ($)</label>
                <input type="number" id="calc-amount" value="10000">
            </div>
            <div class="form-group">
                <label>Interest Rate (APR %)</label>
                <input type="number" id="calc-rate" value="7.5" step="0.1">
            </div>
            <div class="form-group">
                <label>Term (Months)</label>
                <input type="number" id="calc-term" value="36">
            </div>
            <button id="calculate-btn" class="btn btn-primary" style="width: 100%;">Calculate</button>
            
            <div class="result-box">
                <p>Estimated Monthly Payment</p>
                <div id="monthly-payment">$0.00</div>
            </div>
        </div>
    </div>
    <script type="module" src="calculator.js"></script>
</body>
</html>
