<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login | Corridor Funding</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <a href="index.html" class="logo">CORRIDOR FUNDING</a>
            <h2>Welcome Back</h2>
        </div>
        <form id="login-form">
            <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
            <div style="text-align: right; margin-bottom: 15px;"><a href="forgot-password.html" style="font-size: 0.8rem;">Forgot Password?</a></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <button class="google-btn" id="google-login">Login with Google</button>
        <div class="auth-footer">Don't have an account? <a href="register.html">Sign Up</a></div>
    </div>
    <script type="module">
        import { loginUser, signInWithGoogle } from './auth.js';
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await loginUser(e.target.email.value, e.target.password.value);
                window.location.href = 'dashboard.html';
            } catch (err) { alert("Invalid login credentials."); }
        });
        document.getElementById('google-login').onclick = async () => {
            try { await signInWithGoogle(); window.location.href = 'dashboard.html'; }
            catch (err) { alert(err.message); }
        };
    </script>
</body>
</html>
