<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Account Settings | Corridor Funding</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <main class="main-content">
            <h1>Account Settings</h1>
            <div class="card" style="max-width: 600px; margin-top: 20px;">
                <h3>Security</h3>
                <p style="color: var(--text-light); margin-bottom: 20px;">Update your password regularly to keep your account secure.</p>
                <button class="btn btn-outline" id="change-pass-btn">Reset Password via Email</button>
                
                <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--medium-gray);">
                
                <h3>Notifications</h3>
                <div style="margin-top: 15px;">
                    <label><input type="checkbox" checked> Email notifications for application updates</label><br><br>
                    <label><input type="checkbox" checked> Marketing and promotion emails</label>
                </div>
            </div>
        </main>
    </div>
    <script type="module">
        import { auth } from './firebase-init.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        document.getElementById('change-pass-btn').onclick = async () => {
            await sendPasswordResetEmail(auth, auth.currentUser.email);
            alert("Security reset email sent to " + auth.currentUser.email);
        };
    </script>
</body>
</html>
