<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Reset Password | Corridor Funding</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h2>Reset Password</h2>
        <p style="margin-bottom: 20px;">Enter your email to receive a password reset link.</p>
        <form id="reset-form">
            <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
        </form>
        <div class="auth-footer"><a href="login.html">Back to Login</a></div>
    </div>
    <script type="module">
        import { auth } from './firebase-init.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        document.getElementById('reset-form').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await sendPasswordResetEmail(auth, e.target.email.value);
                alert("Reset link sent if account exists.");
            } catch (err) { console.error(err); }
        };
    </script>
</body>
</html>
