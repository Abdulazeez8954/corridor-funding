<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Contact Us | Corridor Funding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="padding: 80px 0; max-width: 600px;">
        <h1>Contact Us</h1>
        <div class="card">
            <p>Email: support@corridorfunding.com</p>
            <p>Hours: Mon-Fri, 9am - 6pm EST</p>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--medium-gray);">
            <form>
                <input type="text" placeholder="Your Name" style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <textarea placeholder="How can we help?" style="width: 100%; padding: 10px; height: 100px;"></textarea>
                <button type="button" class="btn btn-primary" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
