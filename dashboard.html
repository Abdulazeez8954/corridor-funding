<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Corridor Funding</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo">CORRIDOR FUNDING</div>
            <nav>
                <a href="dashboard.html" class="nav-item active">Dashboard</a>
                <a href="applications.html" class="nav-item">My Applications</a>
                <a href="loans.html" class="nav-item">My Loans</a>
                <a href="documents.html" class="nav-item">Documents</a>
                <a href="messages.html" class="nav-item">Messages</a>
                <a href="profile.html" class="nav-item">Profile</a>
                <a href="settings.html" class="nav-item">Settings</a>
                <a href="#" id="logout-btn" class="nav-item" style="margin-top: 50px; color: #ef4444;">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div>
                    <h1 id="welcome-text">Welcome back</h1>
                    <p id="current-date" style="color: var(--text-light);"></p>
                </div>
                <div class="user-pill" style="background: white; padding: 10px 20px; border-radius: 50px; box-shadow: var(--shadow);">
                    <span id="user-name-display" style="font-weight: 600;">Loading...</span>
                </div>
            </header>

            <section class="stat-grid">
                <div class="stat-card">
                    <div class="label">Current Balance</div>
                    <div class="value" id="stat-balance">$0.00</div>
                    <div class="trend" style="color: var(--success);">Available to withdraw</div>
                </div>
                <div class="stat-card">
                    <div class="label">Active Loans</div>
                    <div class="value" id="stat-loans">0</div>
                    <div class="trend"><a href="loans.html" style="color: var(--primary-navy);">View details</a></div>
                </div>
                <div class="stat-card">
                    <div class="label">Pending Apps</div>
                    <div class="value" id="stat-apps">0</div>
                    <div class="trend" id="app-status">No active application</div>
                </div>
            </section>

            <h3>Quick Actions</h3>
            <div class="action-grid">
                <div class="action-btn" onclick="location.href='applications.html?new=true'">
                    <div style="font-size: 1.5rem; margin-bottom: 10px;">📄</div>
                    <strong>New Application</strong>
                </div>
                <div class="action-btn" onclick="location.href='documents.html'">
                    <div style="font-size: 1.5rem; margin-bottom: 10px;">📁</div>
                    <strong>Upload Docs</strong>
                </div>
                <div class="action-btn" onclick="location.href='support.html'">
                    <div style="font-size: 1.5rem; margin-bottom: 10px;">💬</div>
                    <strong>Get Support</strong>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
