<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Live Chat | Corridor Funding</title>
    <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css"><link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="dashboard-container">
        <main class="main-content">
            <h1>Support Chat</h1>
            <div class="chat-window">
                <div class="chat-messages" id="chat-msgs"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message...">
                    <button id="send-chat" class="btn btn-primary">Send</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="live-chat.js"></script>
</body>
</html>
